<style>
/* Layout: coluna única de app de campo (máx. 480px), cabeçalho fixo no topo e barra de ação fixa embaixo; vidro translúcido sobre fundo azul-noite */
:root{
  --bg:#0C1A21; --glow:#24485A; --fg:#EEF5F8; --muted:#A9BEC8; --soft:#C9D8DF;
  --surface:rgba(255,255,255,.06); --surface-2:rgba(255,255,255,.1); --line:rgba(255,255,255,.14);
  --accent:#BCE4F2; --on-accent:#0C1A21; --accent-soft:rgba(188,228,242,.12); --accent-line:rgba(188,228,242,.45);
  --ok:#7FE0A8; --ok-soft:rgba(127,224,168,.15); --warn:#F5C670; --warn-soft:rgba(245,198,112,.15); --bad:#FF9A8F; --bad-soft:rgba(255,154,143,.15);
  --splash-1:#2A5468; --splash-2:#12262F; --splash-3:#0A161C;
  --bar:rgba(12,26,33,.88); --paper:#FFFFFF; --ink:#13202A;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-lg:22px; --r-md:16px; --pill:999px;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--bg) radial-gradient(130% 50% at 85% -5%, var(--glow) 0%, var(--bg) 60%) no-repeat;background-attachment:fixed;color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.btn,label.icon-btn{position:relative;overflow:hidden}
.pick{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px;z-index:1;margin:0;padding:0;border:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%;display:flex;flex-direction:column}
.view{display:flex;flex-direction:column;gap:16px;padding-block:0 24px;flex:1}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.3px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding-block:14px 10px;margin-inline:-16px;padding-inline:16px;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar-t{flex:1;min-width:0;display:flex;flex-direction:column}
.bar-t h1{font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{font-size:22px!important;font-weight:700!important}
.icon-btn{width:44px;height:44px;flex:none;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pill-tag{font-size:13px;font-weight:600;color:var(--on-accent);background:var(--accent);padding:6px 12px;border-radius:var(--pill)}
.glass{border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:18px}
.hero{display:flex;flex-direction:column;gap:12px}
.hero h2{font-size:26px;font-weight:600}
.h2{font-size:17px;font-weight:600}
.btn{min-height:48px;padding:0 20px;border-radius:var(--pill);border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}
.foot.foot-rel{position:static;background:none;padding-top:4px;margin-top:4px}
a.btn{color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--on-accent);border:0}
.btn.dashed{border:1px dashed var(--accent-line);background:transparent;color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.block{width:100%}
.btn.big{min-height:56px;font-size:16px;justify-content:space-between;padding:0 22px 0 26px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.hero .btn{align-self:flex-start}
.list{display:flex;flex-direction:column;gap:10px}
.oscard{width:100%;text-align:left;border-radius:18px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);padding:14px;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.oscard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.oscard .t{font-size:15px;font-weight:600}
.badge{font-size:11px;font-weight:600;padding:4px 9px;border-radius:var(--pill);white-space:nowrap}
.badge.warn{color:var(--warn);background:var(--warn-soft)} .badge.ok{color:var(--ok);background:var(--ok-soft)} .badge.ex{color:var(--accent);background:var(--accent-soft)}
.empty{border:1px dashed var(--line);border-radius:18px;padding:24px;text-align:center;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.legend{font-size:13px;font-weight:600;color:var(--soft)}
.inp{width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;outline:none}
textarea.inp{padding:12px 14px;resize:vertical;min-height:84px}
.inp::placeholder{color:#8FA6B2}
.inp:focus{border-color:var(--accent-line)}
.err{color:var(--bad);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 18px;border-radius:var(--pill);border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.radio{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.radio:has(input:checked){border-color:var(--accent-line);background:var(--accent-soft)}
.radio input{width:20px;height:20px;accent-color:var(--accent);margin:0;flex:none}
.radio b{display:block;font-size:15px} .radio small{color:var(--muted);font-size:13px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{padding:0;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mf{border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;display:flex;flex-direction:column;gap:2px;cursor:text}
.mf span.l{font-size:12px;color:var(--muted)}
.mf .row{display:flex;align-items:baseline;gap:6px}
.mf input{width:0;flex:1;border:0;outline:none;background:transparent;font-size:24px;font-weight:600;padding:0;min-height:34px}
.mf:focus-within{border-color:var(--accent-line)}
.mf em{font-style:normal;font-size:12px;color:var(--muted)}
.steps{display:grid;gap:6px;margin-top:-4px}
.step{border:0;background:transparent;padding:6px 0 0;display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:var(--muted);text-align:left;cursor:pointer;min-height:44px}
.step i{height:4px;border-radius:2px;background:var(--line)}
.step.done{color:var(--ok)} .step.done i{background:var(--ok)}
.step.on{color:var(--accent);font-weight:600} .step.on i{background:var(--accent)}
.result{border-radius:var(--r-lg);border:1px solid var(--accent-line);background:var(--accent-soft);padding:16px;display:flex;flex-direction:column;gap:14px}
.result .k{font-size:12px;color:var(--soft)}
.result .v{font-size:32px;font-weight:600;line-height:1.15}
.result .s{font-size:11px;color:var(--muted)}
.v.low,.v.high{color:var(--warn)}
.diag{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:12px 14px}
.diag.ok{background:var(--ok-soft)} .diag.warn{background:var(--warn-soft)} .diag.bad{background:var(--bad-soft)}
.diag svg{flex:none;margin-top:1px}
.diag b{display:block;font-size:14px}
.diag span{font-size:13px;color:var(--soft)}
.note{font-size:12px;color:var(--muted)}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:6;transform:translate(-50%,-80px);display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:#14272F;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--soft);box-shadow:0 8px 24px rgba(0,0,0,.35);pointer-events:none;opacity:0;white-space:nowrap}
.ptr.anim{transition:transform .25s ease,opacity .25s ease}
.ptr .ring{width:30px;height:30px;border-radius:15px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.ptr.spin .ring svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ptr-hint{align-self:center;display:flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);font-size:12px;padding:6px 10px;margin-top:-8px;cursor:pointer;min-height:36px}
.result.flash{animation:flash .7s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(188,228,242,.55)}100%{box-shadow:0 0 0 14px rgba(188,228,242,0)}}
.foot{position:sticky;bottom:0;z-index:4;margin-inline:-16px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;flex-direction:column;gap:10px;margin-top:auto}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:4px;border-radius:var(--pill);border:1px solid var(--line);background:var(--surface)}
.seg button{min-height:44px;border:0;border-radius:var(--pill);background:transparent;color:var(--soft);font-size:14px;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.segbtn{position:relative;overflow:hidden;min-height:44px;border-radius:var(--pill);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--soft);font-size:14px;font-weight:500;cursor:pointer}
.segbtn.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ph{margin:0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#1B2F38}
.ph .cap{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 10px}
.ph input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:13px;min-height:40px}
.ph button{width:40px;height:40px;border:0;background:transparent;color:var(--muted);border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.check{border-radius:18px;border:1px solid var(--line);background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.check.at{border-color:rgba(245,198,112,.45);background:rgba(245,198,112,.06)}
.check.nc{border-color:rgba(255,154,143,.5);background:rgba(255,154,143,.06)}
.check.ok{border-color:rgba(127,224,168,.35)}
.check h3{font-size:15px;font-weight:600}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tri button{min-height:44px;border-radius:var(--pill);border:1px solid var(--line);background:transparent;color:var(--soft);font-size:13px;font-weight:500;cursor:pointer}
.tri button[aria-pressed="true"].ok{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:600}
.tri button[aria-pressed="true"].at{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:600}
.tri button[aria-pressed="true"].nc{background:var(--bad-soft);color:var(--bad);border-color:transparent;font-weight:600}
.check .sub{display:flex;gap:8px;align-items:center}
.check .sub input{flex:1;min-width:0;min-height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;padding:0 12px;outline:none;font-size:14px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:52px;height:52px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.progress{display:flex;flex-direction:column;gap:8px}
.progress .tr{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress .tr i{display:block;height:100%;background:var(--accent);border-radius:3px}
.rows{display:flex;flex-direction:column;gap:8px}
.rows div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.rows dt,.rows .a{color:var(--muted)}
.rows .b{text-align:right;min-width:0;overflow-wrap:anywhere}
.qlist{display:flex;flex-direction:column;gap:6px}
.qitem{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.qitem span{flex:1}
.qitem button{width:40px;height:40px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:10px;display:flex;align-items:center;justify-content:center}
.inline{display:flex;gap:8px;align-items:flex-end}
.inline .field{flex:1}
.chart{width:100%;height:auto;display:block}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent-soft)}

.sigwrap{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--paper);position:relative;touch-action:none}

.logo-prev{display:flex;align-items:center;gap:12px}

.warnbox{border-radius:16px;padding:12px 14px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.splash{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative;padding-block:24px;animation:none}
.splash::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(110% 70% at 70% 20%,var(--splash-1) 0%,var(--splash-2) 45%,var(--splash-3) 100%)}
.splash .bgflake{position:fixed;left:-40px;top:140px;width:620px;height:620px;opacity:.16;pointer-events:none;z-index:-1}

.splash .tag{font-size:16px;font-weight:500;color:var(--accent)}

.splash .link{font-size:14px;font-weight:500;color:var(--accent);text-decoration:none;padding:10px;background:none;border:0;cursor:pointer}
.splash .dots{margin-top:28px;display:flex;gap:8px}
.splash .dots span{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.3)}
.splash .dots span:first-child{width:22px;background:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;max-width:min(440px,calc(100% - 32px));background:#E8F3F7;color:#0C1A21;padding:12px 16px;border-radius:16px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.35)}

.sug{display:flex;flex-direction:column;gap:6px;margin-top:-8px}
.sug:empty{display:none}
.sug-i{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer;width:100%}
.sug-i b{font-size:15px;font-weight:600} .sug-i small{color:var(--muted);font-size:12px}
.sug-i.exact{border-color:var(--accent-line);background:var(--accent-soft)}
.sel-cli{display:flex;align-items:center;gap:10px;min-height:50px;border-radius:14px;border:1px solid var(--accent-line);background:var(--accent-soft);padding:8px 8px 8px 14px}
.sel-cli div{flex:1;min-width:0;display:flex;flex-direction:column} .sel-cli b{font-size:15px} .sel-cli small{color:var(--muted);font-size:12px}

.pickseg.sm .segbtn{min-height:40px;font-size:13px}
.eq{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.eq div{flex:1;min-width:0;display:flex;flex-direction:column} .eq b{font-size:15px;font-weight:600} .eq small{color:var(--muted);font-size:12px}
.eq .ck-x{margin:0}

.space div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px} .space b{font-size:14px} .space span{font-size:12px;color:var(--muted)}
.space.ok{border-color:rgba(127,224,168,.35)} .space.warn{border-color:rgba(245,198,112,.45);background:var(--warn-soft)}
.space .btn{min-height:40px;padding:0 14px;font-size:13px;flex:none}
.tipos{display:flex;flex-direction:column;gap:10px}
.tipo-opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.tipo-opt .ic{width:48px;height:48px;flex:none;border-radius:16px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.tipo-opt>span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tipo-opt b{font-size:15px;font-weight:600} .tipo-opt small{font-size:13px;color:var(--muted)}
.tipo-opt>svg{flex:none;color:var(--muted)}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.home{gap:0}
.hm-top{display:flex;align-items:center;gap:10px;padding:24px 4px 12px}
.hm-brand{flex:1;min-width:0;display:flex;flex-direction:column}
.hm-brand span{font-size:22px;font-weight:500;letter-spacing:-.3px}
.hm-brand small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-av{width:44px;height:44px;flex:none;border-radius:22px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hm-main{flex:1;padding:6px 4px 18px;display:flex;flex-direction:column;gap:18px}
.hm-hero{border-radius:24px;border:1px solid var(--line);background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:20px;display:flex;flex-direction:column;gap:14px}
.hm-hero h1{font-size:28px;font-weight:500;line-height:1.15}
.hm-hero p{font-size:14px;color:var(--muted);line-height:1.45}
.hm-new{align-self:flex-start;height:48px;padding:0 20px;border:0;border-radius:var(--pill);background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer}
.hm-short{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 0;justify-items:center}
.hm-short button{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:transparent;padding:0;font-size:11.5px;font-weight:500;letter-spacing:-.15px;cursor:pointer;white-space:nowrap;width:100%;overflow:visible}
@media (max-width:380px){.hm-short .ic{width:58px!important;height:58px!important}.hm-short button{font-size:11px;letter-spacing:-.2px}}
@media (max-width:400px){.hm-short button{white-space:normal;text-align:center;line-height:1.25;hyphens:manual}}
.hm-short .ic{width:64px;height:64px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:flex;align-items:center;justify-content:center}
.hm-short .ic.hi{border-color:var(--accent-line);background:var(--accent-soft)}
.hm-list{display:flex;flex-direction:column;gap:10px}
.hm-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hm-h h2{font-size:19px;font-weight:500}
.hm-link{border:0;background:transparent;color:var(--accent);font-size:13px;font-weight:500;padding:8px 0;cursor:pointer}
.hm-nav{position:sticky;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin-top:auto;height:68px;border-radius:24px;border:1px solid var(--line);background:rgba(20,40,50,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));z-index:4}
.hm-nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer}
.hm-nav .ni{height:28px;display:flex;align-items:center;justify-content:center}
.hm-nav [aria-current]{color:var(--accent);font-weight:600}
.hm-nav [aria-current] .ni{width:36px;border-radius:14px;background:rgba(188,228,242,.18)}
.home.view{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
/* ---- tela do ciclo ---- */
:root{--c-hot:#FF8A70;--c-warm:#F5C670;--c-cold:#4FB3F0;--c-cool:#BCE4F2;--pipe-hi:rgba(255,138,112,.3);--pipe-lo:rgba(79,179,240,.32)}
.cy-intro{font-size:14px;color:var(--soft);line-height:1.5}
.cy-stage{padding:10px 8px 12px}
.cy-stage svg{display:block;width:100%;height:auto}
.cy-stage .pipe{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;transition:opacity .3s}
.cy-stage .pipe.hi{stroke:var(--pipe-hi)} .cy-stage .pipe.lo{stroke:var(--pipe-lo)}
.cp{cursor:pointer;transition:opacity .3s}
.cp rect{stroke-width:1.3;transition:stroke-width .3s}
.cp.hi rect{fill:#2E2A2C;stroke:rgba(255,138,112,.75)}
.cp.lo rect{fill:#16303F;stroke:rgba(79,179,240,.8)}
.cp.nt rect{fill:#1F2C33;stroke:rgba(255,255,255,.32)}
.cp .t{font:600 13px var(--font);fill:var(--fg)}
.cp .s{font:400 10.5px var(--font);fill:var(--muted)}
.cp:focus{outline:none}.cp:focus-visible rect{stroke:var(--accent);stroke-width:2.4}
.gg circle{fill:var(--bg);stroke:var(--muted);stroke-width:1.2}
.gg text{font:600 9px var(--font);fill:var(--fg)}
.gg,.heat,.cy-lbl{transition:opacity .3s}
.cy-lbl{font:500 10.5px var(--font);fill:var(--muted)}
.cy-side{font:600 10px var(--font);letter-spacing:.1em}
.grp{fill:none;stroke:rgba(255,255,255,.18);stroke-dasharray:5 5}
.grp-t{font:600 9.5px var(--font);letter-spacing:.1em;fill:var(--muted)}
.heat path{fill:none;stroke-width:1.8;stroke-linecap:round}
.heat.out path{stroke:var(--c-hot)} .heat.in path{stroke:var(--c-cold)}
.focus .dim{opacity:.2} .focus .dim.on{opacity:1}
.focus .cp.on rect{stroke-width:2.6}
@media (prefers-reduced-motion:no-preference){.heat path{animation:rise 1.8s ease-in-out infinite}.heat path:nth-child(2){animation-delay:.6s}.heat path:nth-child(3){animation-delay:1.2s}}
@keyframes rise{0%{transform:translateY(5px);opacity:0}40%{opacity:1}100%{transform:translateY(-5px);opacity:0}}
.cy-leg{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 6px 0;font-size:11.5px;color:var(--muted)}
.cy-leg span{display:inline-flex;align-items:center;gap:6px}
.cy-leg i{display:inline-block}
.cy-card{display:flex;flex-direction:column;gap:14px}
.cy-nav{display:flex;align-items:center;gap:10px}
.cy-name{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;gap:2px}
.cy-name h2{font-size:21px;font-weight:600}
.cy-desc{font-size:14.5px;line-height:1.55}
.cy-tip{border-top:1px solid var(--line);padding-top:12px;font-size:13.5px;color:var(--soft);line-height:1.5}
.cy-tip b{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.badge.hi{color:var(--c-hot);background:rgba(255,138,112,.14)} .badge.lo{color:var(--c-cold);background:rgba(79,179,240,.15)}
.cy-sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cy-sum button{text-align:left;border-radius:18px;border:1px solid var(--line);background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.cy-sum .n{width:24px;height:24px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.cy-sum b{font-size:14.5px;font-weight:600}
.cy-sum span.x{font-size:12.5px;color:var(--muted);line-height:1.4}
/* ---- resposta ao toque: encolhe e muda o brilho enquanto o dedo está no botão ---- */
button,.btn,.segbtn,.icon-btn,.chip,.oscard,.radio,.hm-short .ic,.cp{transition:transform .12s ease,filter .12s ease,background-color .12s ease,border-color .12s ease}
:is(button,.btn,.icon-btn,.chip,.oscard,.radio,.segbtn):is(:active,.press){transform:scale(.95);filter:brightness(1.25)}
:is(.segbtn.on,.btn.primary,.hm-new,.splash .go,.chip[aria-pressed="true"],.seg button[aria-pressed="true"]):is(:active,.press){filter:brightness(.88)}
:is(.btn.block,.oscard,.radio):is(:active,.press){transform:scale(.98)}
.hm-short button:is(:active,.press),.hm-nav button:is(:active,.press){transform:none;filter:none}
.hm-short button:is(:active,.press) .ic{transform:scale(.9);background:var(--accent-soft);border-color:var(--accent-line)}
.hm-nav button:is(:active,.press) .ni{transform:scale(.88);filter:brightness(1.4)}
.hm-nav .ni{transition:transform .12s ease}
.cp:is(:active,.press){filter:brightness(1.5)}
@media (prefers-reduced-motion:reduce){:is(button,.btn,.icon-btn,.chip,.oscard,.radio,.cp):is(:active,.press),.press :is(.ic,.ni){transform:none!important}}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}

/* ordens antigas: checklist por posição vira lista com nome e id; fotos de item passam a apontar para o id */
function normOS(o){if(!o.man)o.man=MAN0();if(!Array.isArray(o.prev))o.prev=[];
 if(o.prev.length&&o.prev[0].t==null){o.prev=o.prev.map((x,i)=>({id:uid(),t:CHECK[i]||('Item '+(i+1)),s:x.s||null,obs:x.obs||''}))}
 (o.fotos||[]).forEach(f=>{if(f.item!=null&&!f.itemId&&o.prev[f.item])f.itemId=o.prev[f.item].id});return o}
function cliOf(o){return S.clientes.find(c=>c.id===o.clienteId)}
/* liga a OS a um cliente e equipamento do cadastro (cria se não existir, nunca duplica o nome) */
function linkOS(o){if(o.clienteId&&cliOf(o))return false;const nome=(o.cliente||'').trim();if(!nome)return false;
 let c=S.clientes.find(x=>norm(x.nome)===norm(nome));if(!c){c={id:uid(),nome,local:o.local||'',equips:[]};S.clientes.push(c)}o.clienteId=c.id;
 const en=(o.equipamento||'').trim();if(en){let e=c.equips.find(x=>norm(x.nome)===norm(en));if(!e){e={id:uid(),nome:en,gas:o.gas||''};c.equips.push(e)}o.equipId=e.id}return true}

function idbGet(k){return new Promise(res=>{if(!DB.ok)return res(undefined);try{const q=DB.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)}catch(e){res(undefined)}})}
function idbSet(k,v){return new Promise(res=>{if(!DB.ok)return res(false);try{const tx=DB.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);tx.onabort=()=>res(false)}catch(e){res(false)}})}
function idbDel(k){return new Promise(res=>{if(!DB.ok)return res(false);try{const tx=DB.db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})}

async function flush(){
  if(!DB.ok)return;
  if(dirtyS){dirtyS=false;await idbSet('settings',S.settings)}
  if(dirtyC){dirtyC=false;await idbSet('clientes',S.clientes)}
  for(const id of [...dirty]){dirty.delete(id);const o=S.list.find(x=>x.id===id);if(o){const ok=await idbSet('os:'+id,o);if(!ok)toast('Não foi possível salvar. O armazenamento do aparelho pode estar cheio.')}}
  if(dirtyIds){dirtyIds=false;await idbSet('ids',S.list.map(o=>o.id))}
}

/* ---------- cálculo e diagnóstico ---------- */
/* Pressão de descarga (psig) esperada por temperatura ambiente, [mín, máx] */
const DESC_TA=[5,10,15,20,24,28,32,36,38];
const DESC={
 R22:[[106,122],[126,142],[145,163],[170,190],[190,205],[205,230],[230,255],[255,280],[280,300]],
 R404A:[[130,148],[150,170],[177,195],[200,220],[220,250],[250,275],[275,305],[305,335],[335,355]],
 R134a:[[60,72],[74,85],[88,100],[105,118],[118,132],[132,150],[150,168],[168,185],[185,203]]
};
function descRange(gas,ta){const t=DESC[gas];if(!t||ta==null||ta<DESC_TA[0]||ta>DESC_TA[DESC_TA.length-1])return null;
 let i=0;while(i<DESC_TA.length-2&&ta>DESC_TA[i+1])i++;const f=(ta-DESC_TA[i])/(DESC_TA[i+1]-DESC_TA[i]);
 return [t[i][0]+f*(t[i+1][0]-t[i][0]),t[i][1]+f*(t[i+1][1]-t[i][1])]}
function calc(o){
  const st=S.settings;
  const ps=num(o.med.ps),pd=num(o.med.pd),ts=num(o.med.ts),tl=num(o.med.tl),ta=num(o.med.ta);
  const te=ps==null?null:satT(o.gas,ps,'d');
  const tc=pd==null?null:satT(o.gas,pd,'b');
  const sa=te!=null&&ts!=null?ts-te:null;
  const sr=tc!=null&&tl!=null?tc-tl:null;
  const ap=tc!=null&&ta!=null?tc-ta:null;
  const lv=(v,a,b)=>v==null?null:v<a?'low':v>b?'high':'ok';
  const dr=descRange(o.gas,ta);const lap=dr&&pd!=null?(pd<dr[0]-1?'low':pd>dr[1]+1?'high':'ok'):null;
  return {te,tc,sa,sr,ap,dr,lap,ta,outS:ps!=null&&te==null,outD:pd!=null&&tc==null,la:lv(sa,num(st.saMin),num(st.saMax)),lr:lv(sr,num(st.srMin),num(st.srMax))};
}
/* Decisão pela combinação SA (superaquecimento) x SR (sub-resfriamento). Chave: SA-SR */
const DIAG={
 'ok-ok':['ok','Carga e válvula dentro da faixa','Nenhuma ação necessária na válvula ou na carga.'],
 'high-low':['bad','Falta de fluido refrigerante','Colocar fluido (diminui o SA e aumenta o SR). Procure e corrija o vazamento antes de completar.'],
 'low-high':['bad','Excesso de fluido refrigerante','Retirar fluido (aumenta o SA e diminui o SR).'],
 'high-high':['warn','Evaporador com pouco fluido e líquido acumulado no condensador','Abrir a válvula de expansão (diminui o SA e o SR). Se não responder, suspeite de restrição no filtro secador ou na linha de líquido.'],
 'low-low':['warn','Válvula de expansão alimentando demais','Fechar a válvula de expansão (aumenta o SA e o SR). Confira também ventiladores e gelo no evaporador.'],
 'high-ok':['warn','Evaporador recebendo pouco fluido','Abrir a válvula de expansão aos poucos e acompanhar o SR. Confira o bulbo e se há restrição antes da válvula.'],
 'low-ok':['bad','Risco de retorno de líquido ao compressor','Fechar a válvula de expansão aos poucos e acompanhar o SR.'],
 'ok-low':['warn','Carga no limite ou condensador trocando pouco','Se o visor mostrar bolhas, colocar fluido aos poucos. Confira a limpeza do condensador. Com tanque de líquido, SR baixo pode ser normal.'],
 'ok-high':['warn','Possível excesso leve de carga ou restrição','Descarte restrição no filtro secador e depois retire fluido aos poucos.'],
};
function diag(c){
  if(c.te!=null&&c.tc!=null&&c.tc<=c.te)return {sev:'warn',t:'Leituras inconsistentes',a:'A pressão de alta está abaixo ou igual à de baixa. Confira as leituras e as mangueiras.'};
  if(c.sa!=null&&c.sa<=0.5)return {sev:'bad',t:'Superaquecimento zero ou negativo',a:'Há líquido saindo do evaporador: risco de golpe de líquido. Feche a válvula de expansão e confira a troca de calor no evaporador e a medição.'};
  if(c.la&&c.lr){const d=DIAG[c.la+'-'+c.lr];return {sev:d[0],t:d[1],a:d[2]}}
  if(c.la){return c.la==='ok'?{sev:'ok',t:'Superaquecimento dentro da faixa',a:'Meça o sub-resfriamento para avaliar a carga.'}:c.la==='high'?{sev:'warn',t:'Superaquecimento alto',a:'Pouca alimentação ou falta de fluido. Meça o sub-resfriamento para separar as causas.'}:{sev:'bad',t:'Superaquecimento baixo',a:'Risco de retorno de líquido ao compressor. Feche a válvula de expansão aos poucos.'}}
  if(c.lr){return c.lr==='ok'?{sev:'ok',t:'Sub-resfriamento dentro da faixa',a:'Meça o superaquecimento para avaliar a válvula.'}:c.lr==='high'?{sev:'warn',t:'Sub-resfriamento alto',a:'Possível excesso de carga ou restrição. Meça o superaquecimento.'}:{sev:'warn',t:'Sub-resfriamento baixo',a:'Possível falta de carga. Confira o visor de líquido.'}}
  return null;
}

let cyRAF=null,cyParts=[],cyOff=0,cyLast=0,cyCol={};
function cyShow(){const c=CY[S.cyModo||'ref'],n=c.steps.length-1;S.cyStep=((S.cyStep||0)+n+1)%(n+1);const st=c.steps[S.cyStep];
 $('#cyK').textContent=S.cyStep?'Etapa '+S.cyStep+' de '+n:'Visão geral';$('#cyT').textContent=st.t;$('#cyS').textContent=st.s;
 const b=$('#cySide');b.className='badge '+(st.side==='both'?'ex':st.side);b.textContent=st.sideT;$('#cyD').textContent=st.d;$('#cyTip').textContent=st.tip;
 const svg=$('#cySvg');svg.classList.toggle('focus',st.f.length>0);svg.querySelectorAll('.dim').forEach(el=>el.classList.toggle('on',st.f.includes(el.id)))}
function cyHex(h){h=h.trim().replace('#','');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}
function cyMix(a,b,t){return'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')'}
function cyState(L){const C=cyCol,cl=x=>Math.max(0,Math.min(1,x)),E=CY[S.cyModo||'ref'].exp;
 if(L<22)return[cyMix(C.cool,C.hot,(L+22)/44),0];
 if(L<260)return[cyMix(C.hot,C.hot,0),0];
 if(L<360){const t=(L-260)/100;return[cyMix(C.hot,C.warm,t),cl((t-.15)/.6)]}
 if(L<E[0])return[cyMix(C.warm,C.warm,0),1];
 if(L<E[1]){const t=(L-E[0])/(E[1]-E[0]);return[cyMix(C.warm,C.cold,t),1-.4*t]}
 if(L<820)return[cyMix(C.cold,C.cold,0),.6];
 if(L<920){const t=(L-820)/100;return[cyMix(C.cold,C.cool,t),.6*cl(1-t/.85)]}
 if(L<1098)return[cyMix(C.cool,C.cool,0),0];
 return[cyMix(C.cool,C.hot,(L-1098)/44),0]}
function cyFrame(now){const tr=$('#cyTrack');if(!tr||S.view!=='ciclo'){cyRAF=null;return}
 const dt=Math.min(.05,(now-cyLast)/1000);cyLast=now;const tot=1120,N=cyParts.length;
 cyOff=(cyOff+dt*60*(matchMedia('(prefers-reduced-motion: reduce)').matches?.3:1))%tot;
 for(let i=0;i<N;i++){const L=(cyOff+i*tot/N)%tot,p=tr.getPointAtLength(L),[col,ph]=cyState(L),c=cyParts[i];
  c.setAttribute('cx',p.x.toFixed(1));c.setAttribute('cy',p.y.toFixed(1));c.setAttribute('r',(2.6+2.2*ph).toFixed(2));c.setAttribute('stroke',col);c.setAttribute('fill',col);c.setAttribute('fill-opacity',(.1+.9*ph).toFixed(2))}
 cyRAF=requestAnimationFrame(cyFrame)}
function cyInit(){const cs=getComputedStyle(document.documentElement);['hot','warm','cold','cool'].forEach(k=>cyCol[k]=cyHex(cs.getPropertyValue('--c-'+k)));
 const g=$('#cyParts');cyParts=[];for(let i=0;i<32;i++){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('stroke-width','1.8');g.appendChild(c);cyParts.push(c)}
 cyShow();if(!cyRAF){cyLast=performance.now();cyRAF=requestAnimationFrame(cyFrame)}}

 <div><div class="k">Sub-resfriamento</div><div class="v ${c.lr&&c.lr!=='ok'?c.lr:''}">${c.sr==null?'—':f1(c.sr)+' K'}</div><div class="s">${c.outD?'Pressão fora da tabela':'Cond. sat. '+(c.tc==null?'—':f1(c.tc)+' °C')} · faixa ${esc(st.srMin)}–${esc(st.srMax)} K</div></div></div>
 ${d?`<div class="diag ${d.sev}" style="color:var(--${d.sev==='ok'?'ok':d.sev==='warn'?'warn':'bad'})">${d.sev==='ok'?I.ok:I.warn}<div><b style="color:var(--fg)">${esc(d.t)}</b><span>${esc(d.a)}</span></div></div>`:'<p class="note">Preencha pressões e temperaturas dos tubos para ver o diagnóstico.</p>'}
 ${c.dr?`<div class="diag ${c.lap==='ok'||!c.lap?'ok':'warn'}" style="color:var(--${c.lap==='ok'||!c.lap?'ok':'warn'})">${c.lap&&c.lap!=='ok'?I.warn:I.ok}<div><b style="color:var(--fg)">Descarga esperada: ${Math.round(c.dr[0])} a ${Math.round(c.dr[1])} psig</b><span>Para ${f1(c.ta)} °C de ambiente.${apTxt(c.lap)}</span></div></div>`:c.ap!=null?`<p class="note">Condensação ${f1(c.ap)} K acima do ambiente${c.ap>20?'. Diferença alta: verifique limpeza do condensador, ventilador e presença de ar no sistema.':'.'}</p>`:''}`}

function chartSVG(q,alvo){if(q.length<2)return '<p class="note">Registre ao menos duas leituras para ver a curva.</p>';
 const W=320,H=150,pl=34,pr=12,pt=10,pb=22;const t0=q[0].t,t1=q[q.length-1].t;const vs=q.map(p=>p.v);
 let lo=Math.min(...vs),hi=Math.max(...vs);if(alvo!=null){lo=Math.min(lo,alvo);hi=Math.max(hi,alvo)}if(hi-lo<2){hi+=1;lo-=1}
 const X=t=>pl+(W-pl-pr)*((t-t0)/Math.max(1,t1-t0)),Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
 const pts=q.map(p=>X(p.t).toFixed(1)+','+Y(p.v).toFixed(1));
 const area=`M${X(t0).toFixed(1)},${(H-pb)} L${pts.join(' L')} L${X(t1).toFixed(1)},${H-pb} Z`;
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva de queda de temperatura">
 <line class="gd" x1="${pl}" y1="${Y(hi)}" x2="${W-pr}" y2="${Y(hi)}"/><line class="gd" x1="${pl}" y1="${Y(lo)}" x2="${W-pr}" y2="${Y(lo)}"/>
 <text x="${pl-6}" y="${Y(hi)+3}" text-anchor="end">${f1(hi)}</text><text x="${pl-6}" y="${Y(lo)+3}" text-anchor="end">${f1(lo)}</text>
 ${alvo!=null?`<line class="tg" x1="${pl}" y1="${Y(alvo)}" x2="${W-pr}" y2="${Y(alvo)}"/><text x="${W-pr}" y="${Y(alvo)-4}" text-anchor="end">alvo ${f1(alvo)} °C</text>`:''}
 <path class="ar" d="${area}"/><polyline class="ln" points="${pts.join(' ')}"/>
 ${q.map(p=>`<circle class="dt" cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3"/>`).join('')}
 <text x="${pl}" y="${H-6}">${fmtHora(t0)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${fmtHora(t1)}</text></svg>`}

function quedaStats(o){const q=o.queda;if(q.length<2)return '';const h=(q[q.length-1].t-q[0].t)/36e5;if(h<=0)return '';const rate=(q[0].v-q[q.length-1].v)/h;const alvo=num(o.camara.tp);
 let extra='';if(alvo!=null&&rate>0){const falta=q[q.length-1].v-alvo;extra=falta<=0?' · Alvo atingido':' · Previsão para o alvo: '+(falta/rate<1?Math.round(falta/rate*60)+' min':f1(falta/rate)+' h')}
 return `<p class="note">Queda de ${f1(rate)} °C/h em ${h<1?Math.round(h*60)+' min':f1(h)+' h'}${extra}</p>`}

 ${list.length?`<div class="photos">${list.map(({p,i})=>`<figure class="ph"><img src="${thumbOf(p)}" alt="${esc(p.legenda||'Foto')}" loading="lazy" decoding="async"><figcaption class="cap"><input aria-label="Legenda da foto" data-bind="fotos.${i}.legenda" data-scope="os" value="${esc(p.legenda)}" placeholder="Legenda"><button data-act="delFoto" data-i="${i}" aria-label="Remover foto">${I.x}</button></figcaption></figure>`).join('')}</div>`:`<p class="note">Nenhuma foto ainda. Toque no botão acima para adicionar.</p>`}
 ${field('Observações e recomendações','obs','os',{area:true,ph:'Ex.: recomenda-se limpeza do filtro a cada 30 dias'})}`}

 if(name==='Câmara'){body=`${field('Equipamento / unidade','equipamento','os')}${field('Temp. de projeto (°C)','camara.tp','os',{dec:true,ph:'Ex.: -18'})}${field('Observações','camara.obs','os',{area:true})}`}
 else if(name==='Medições'){body=`<button class="ptr-hint" data-act="recalc">${sv('<path d="M12 5v14M6 13l6 6 6-6"/>',14)}Puxe a tela para baixo para recalcular</button><div class="grid2">${mf('Pressão de sucção','med.ps',u)}${mf('Temp. tubo sucção','med.ts','°C')}${mf('Pressão de descarga','med.pd',u)}${mf('Temp. tubo líquido','med.tl','°C')}${mf('Temp. ambiente','med.ta','°C')}${mf('Corrente compressor','med.ic','A')}</div>
 <section class="result" id="calc" aria-live="polite">${calcHTML(o)}</section><p class="note">Sucção pela curva de orvalho e descarga pela curva de bolha do ${o.gas}. Meça a temperatura do tubo perto do bulbo e na saída do condensador.</p>`}

 else if(name==='Checklist'){const L=o.prev,done=L.filter(x=>x.s).length;body=`<div class="progress"><div style="display:flex;justify-content:space-between;font-size:13px"><span class="muted">Checklist</span><b>${done} de ${L.length} itens</b></div><div class="tr"><i style="width:${L.length?Math.round(done/L.length*100):0}%"></i></div></div>
 <div class="inline">${field('Novo item do checklist','_item','tmp',{ph:'Ex.: Teste do pressostato'})}<button class="btn primary" data-act="addItem" style="min-height:50px">Adicionar</button></div>
 ${L.map((it,i)=>{const ph=o.fotos.filter(p=>p.itemId===it.id);return `<article class="check ${it.s||''}"><div class="ck-h"><h3>${esc(it.t)}</h3><button class="ck-x" data-act="delItem" data-i="${i}" aria-label="Remover item ${esc(it.t)}">${I.x}</button></div><div class="tri" role="group" aria-label="Situação de ${esc(it.t)}">${[['ok','OK'],['at','Atenção'],['nc','Não conforme']].map(([k,l])=>`<button class="${k}" data-act="chk" data-i="${i}" data-s="${k}" aria-pressed="${it.s===k}">${l}</button>`).join('')}</div>

 ${ph.length?`<div class="thumbs">${ph.map(p=>`<img src="${thumbOf(p)}" alt="${esc(p.legenda)}" loading="lazy" decoding="async">`).join('')}</div>`:''}
 <div class="seg pickseg sm" role="group" aria-label="Foto da execução de ${esc(it.t)}"><label class="segbtn on">${I.cam} Foto da execução<input class="pick" type="file" accept="image/*" capture="environment" data-photo="item" data-i="${i}"></label><label class="segbtn">${I.gal} Galeria<input class="pick" type="file" accept="image/*" data-photo="item" data-i="${i}" multiple></label></div></article>`}).join('')}
 ${L.length?'':'<div class="empty">Checklist vazio. Adicione os itens no campo acima.</div>'}
 ${L.length?`<button class="btn dashed block" data-act="salvarModelo">Salvar este checklist como modelo</button>`:''}`}
 else if(name==='Defeito'){body=`${field('Defeito relatado pelo cliente','man.defeito','os',{area:true,ph:'Ex.: câmara não chega na temperatura'})}${field('Diagnóstico / causa encontrada','man.causa','os',{area:true,ph:'Ex.: contatora do compressor com contatos queimados'})}`}
 else if(name==='Serviço'){body=`${field('Serviço executado','man.servico','os',{area:true,ph:'Ex.: troca da contatora e reaperto dos bornes'})}${field('Peças substituídas','man.pecas','os',{area:true,ph:'Uma por linha. Ex.: contatora 25 A'})}
 <fieldset><legend class="legend">Situação ao final</legend><div class="chips">${Object.keys(MAN_SIT).map(k=>`<button class="chip" data-act="manSit" data-s="${k}" aria-pressed="${o.man.situacao===k}">${MAN_SIT[k][0]}</button>`).join('')}</div></fieldset>`}
 else if(name==='Fotos'){body=photosHTML(o)}
 const last=S.step===st.length-1;
 return `<div class="view">${bar(TIPOS[o.tipo],'OS '+o.numero+' · '+(o.cliente||''),'home',`${o.tipo==='com'?`<span class="pill-tag">${o.gas}</span>`:''}<button class="icon-btn" data-act="delOS" aria-label="Excluir ordem">${I.trash}</button>`)}

 <div class="foot"><button class="btn primary big block" data-act="${last?'go':'nextStep'}" data-to="rel">${last?'Ir para o relatório':'Próxima etapa: '+esc(st[S.step+1])} ${I.next}</button></div></div>`};

function espacoOS(o){const b=fotosBytes(o),freed=o.fotos.some(p=>!p.full);
 if(o.status==='concluida'&&b)return `<section class="space"><div><b>${fmtMB(b)} em fotos nesta ordem</b><span>${o.drive&&o.drive.ok?'Já há uma cópia no Google Drive. ':o.icloud?'Já há uma cópia no iCloud. ':''}O PDF já gerado continua completo. Liberar apaga as fotos grandes deste aparelho e mantém as miniaturas.</span></div><button class="btn" data-act="liberarOS">Liberar espaço</button></section>`;
 if(freed&&o.fotos.length)return `<p class="note" style="text-align:center">As fotos desta ordem foram liberadas e estão só em miniatura. Um PDF novo sai com fotos pequenas.</p>`;return ''}

 if(o.tipo==='com'){const c=calc(o),d=diag(c);rows.splice(3,0,['Fluido',o.gas]);rows.push(['Superaquecimento',c.sa==null?'—':f1(c.sa)+' K'],['Sub-resfriamento',c.sr==null?'—':f1(c.sr)+' K'],['Diagnóstico',d?d.t:'—'],['Leituras de queda',o.queda.length])}

 ${S.waPend===o.id?`<a class="btn primary" id="waBtn" href="${waLink(o)}" target="_blank" rel="noopener">${I.wa} WhatsApp</a>`:`<button class="btn primary" data-act="enviar" id="shareBtn" ${S.fullReady===o.id?'':'disabled'}>${I.wa} WhatsApp</button>`}</div>
 <p class="note" id="envioNote" style="text-align:center${S.waPend===o.id?';color:var(--warn)':''}">${S.waPend===o.id?'PDF salvo no aparelho. Toque em WhatsApp, escolha o contato e anexe o PDF pelo clipe. A mensagem já vai escrita.':(S.fullReady===o.id?'O WhatsApp abre com o PDF anexado e uma mensagem pronta.':'Preparando as fotos para o PDF…')}</p></div></div>`};

function promptBox(title,label,ph,okLabel,onOk){const m=$('#modal');m.innerHTML=`<div class="glass" role="dialog" aria-modal="true" aria-labelledby="pt"><h2 id="pt" class="h2">${esc(title)}</h2><label class="field" for="pb-in"><span>${esc(label)}</span><input class="inp" id="pb-in" placeholder="${esc(ph)}" autocomplete="off"></label><p class="err" id="pb-err" hidden></p><div class="acts"><button class="btn" data-m="no">Cancelar</button><button class="btn primary" data-m="yes">${esc(okLabel)}</button></div></div>`;
 m.hidden=false;const inp=$('#pb-in');inp.focus();const ok=()=>{const v=inp.value.trim();if(!v){const e=$('#pb-err');e.textContent='Preencha o campo.';e.hidden=false;return}const r=onOk(v);if(r){const e=$('#pb-err');e.textContent=r;e.hidden=false;return}m.hidden=true};
 inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ok()}};m.onclick=e=>{const b=e.target.closest('[data-m]');if(e.target===m||b&&b.dataset.m==='no')m.hidden=true;else if(b)ok()}}
function liberar(o){let b=0;o.fotos.forEach(p=>{if(p.full){b+=p.size||0;delFull(p.id);p.full=false}});if(b)markOS(o);return b}
function concluidasPesadas(){return S.list.filter(o=>o.status==='concluida'&&fotosBytes(o)>0)}
async function autoLimpeza(){const d=+S.settings.autoLimpar||0;if(!d)return;const lim=Date.now()-d*864e5;let b=0,n=0;
 S.list.forEach(o=>{if(o.status==='concluida'&&o.concluido&&o.concluido<lim&&fotosBytes(o)){b+=liberar(o);n++}});if(n)toast('Espaço liberado: '+fmtMB(b)+' de '+n+' ordem'+(n>1?'s':'')+' concluída'+(n>1?'s':'')+' há mais de '+d+' dias.')}

const MCP={api:null,files:false,checked:false},DRV='Google Drive';S.drv={};
async function initMCP(){try{const m=window.claude&&window.claude.use?await window.claude.use('mcp'):null;MCP.api=m;if(m){try{const l=await m.listTools();MCP.files=!!(l&&l.fileArgs)}catch(e){}}}catch(e){}MCP.checked=true;if(['empresa','rel','cliente'].includes(S.view))render()}
const nuvem=()=>S.settings.nuvem||(S.settings.drive&&S.settings.drive.on?'google':'');
const driveOn=()=>!!(MCP.api&&nuvem()==='google'&&S.settings.drive&&S.settings.drive.on);
const icloudOn=()=>nuvem()==='icloud'||nuvem()==='gshare'||(nuvem()==='google'&&MCP.checked&&!MCP.api);
const nuvemNome=()=>nuvem()==='icloud'?'iCloud':'Google Drive';
const nuvemDica=()=>nuvem()==='icloud'?'Escolha Salvar em Arquivos › iCloud Drive.':'Escolha o app Drive e a pasta SnowField Tech.';
function driveErr(e){const c=e&&e.code;return ({server_not_connected:'Conecte o Google Drive em claude.ai, em Configurações › Conectores, e toque em Tentar de novo.',needs_reauth:'A conexão com o Google Drive expirou. Reconecte em claude.ai, em Configurações › Conectores.',selection_required:'Escolha qual conta do Google Drive usar no aviso do Claude e tente de novo.',not_in_manifest:'O acesso ao Drive não foi permitido para este app. Toque em Tentar de novo e permita.',approval_required:'O envio precisa da sua permissão. Toque em Tentar de novo e permita.',consent_required:'O envio precisa da sua permissão. Toque em Tentar de novo e permita.',blocked_by_policy:'O Google Drive está bloqueado para esta conta.',not_granted:'O Drive não está disponível nesta visualização.',capability_disabled:'O Drive não está disponível nesta visualização.',too_big:'O PDF ficou grande demais para enviar daqui. As fotos foram enviadas.'})[c]||(c==='tool_error'?'O Drive recusou o envio. Toque em Tentar de novo.':'O Drive não respondeu. Confira a internet e toque em Tentar de novo.')}
async function dcall(tool,input){const r=await MCP.api.callTool(DRV,tool,input);return r&&r.payload!=null?r.payload:r}
const qs=v=>String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
const fid=r=>r&&(r.id||(r.file&&r.file.id));
const furl=(r,id)=>(r&&(r.viewUrl||r.webViewLink))||('https://drive.google.com/drive/folders/'+id);
const slugify=v=>String(v||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
function b64(u){let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
function blobBytes(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(new Uint8Array(r.result));r.onerror=()=>rej(r.error);r.readAsArrayBuffer(b)})}
async function dFolder(title,parentId){const q="title = '"+qs(title)+"' and mimeType = 'application/vnd.google-apps.folder' and trashed = false"+(parentId?" and parentId = '"+qs(parentId)+"'":" and owner = 'me'");
 let r=await dcall('search_files',{query:q,pageSize:1,excludeContentSnippets:true});const f=r&&r.files&&r.files[0];if(f&&f.id)return {id:f.id,url:furl(f,f.id)};
 r=await dcall('create_file',Object.assign({title,contentMimeType:'application/vnd.google-apps.folder'},parentId?{parentId}:{}));const id=fid(r);if(!id)throw {code:'tool_error'};return {id,url:furl(r,id)}}
async function ensureRoot(){const d=S.settings.drive||(S.settings.drive={});if(d.rootId)return d.rootId;const f=await dFolder('SnowField Tech');d.rootId=f.id;d.rootUrl=f.url;markS();return f.id}
async function ensureCli(c){if(c.driveId)return c.driveId;const root=await ensureRoot();const f=await dFolder(c.nome,root);c.driveId=f.id;c.driveUrl=f.url;markC();return f.id}
const osPasta=o=>'OS '+o.numero+' · '+TIPOS[o.tipo]+' · '+new Date(o.criado).toLocaleDateString('pt-BR').replace(/\//g,'-');
async function upFile(title,name,mime,bytes,parentId){const inp={title,parentId,contentMimeType:mime,disableConversionToGoogleType:true};
 if(MCP.files)inp.base64Content={$file:{data:bytes,name,type:mime}};else{if(bytes.length>700000)throw {code:'too_big'};inp.base64Content=b64(bytes)}
 const id=fid(await dcall('create_file',inp));if(!id)throw {code:'tool_error'};return id}
async function enviarDrive(o,force,retried){if(!driveOn())return;const st=S.drv[o.id]={st:'sending',n:0,tot:0,msg:''};paintDrive(o);
 try{await prepFull(o);const c=cliOf(o);const parent=c?await ensureCli(c):await ensureRoot();
  o.drive=o.drive||{fotos:{}};o.drive.fotos=o.drive.fotos||{};
  if(!o.drive.folderId){const f=await dFolder(osPasta(o),parent);o.drive.folderId=f.id;o.drive.url=f.url;markOS(o)}
  const fotos=o.fotos.filter(p=>p.full&&!o.drive.fotos[p.id]);const needPdf=force||!o.drive.pdfId;st.tot=fotos.length+(needPdf?1:0);paintDrive(o);

 app.querySelectorAll('input[data-bind^="med."]').forEach(el=>setPath(S.cur,el.dataset.bind,el.value));markOS(S.cur);
 const c=$('#calc');if(c){c.innerHTML=calcHTML(S.cur);c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash')}}
const PTR={y0:null,d:0,busy:false},PTR_MIN=64;
function ptrSet(d,anim){const el=$('#ptr');el.classList.toggle('anim',!!anim);el.style.opacity=Math.min(1,d/36);el.style.transform=`translate(-50%,${Math.round(d-80)}px)`;
 el.querySelector('svg').style.transform=el.classList.contains('spin')?'':`rotate(${Math.round(d*3)}deg)`;if(!PTR.busy)$('#ptrT').textContent=d>=PTR_MIN?'Solte para atualizar':'Puxe para atualizar'}
function ptrRun(){const el=$('#ptr');PTR.busy=true;el.classList.add('spin');$('#ptrT').textContent='Atualizando…';ptrSet(PTR_MIN,true);
 setTimeout(()=>{recalc();el.classList.remove('spin');$('#ptrT').textContent='Cálculo atualizado';setTimeout(()=>{PTR.busy=false;ptrSet(0,true)},700)},400)}
document.addEventListener('touchstart',e=>{PTR.y0=null;if(PTR.busy||!isMed()||window.scrollY>2||e.touches.length>1||e.target.closest('.sigwrap'))return;PTR.y0=e.touches[0].clientY;PTR.d=0},{passive:true});
document.addEventListener('touchmove',e=>{if(PTR.y0==null)return;const dy=e.touches[0].clientY-PTR.y0;if(dy<=0||window.scrollY>2){PTR.d=0;ptrSet(0);return}
 PTR.d=Math.min(110,dy*.55);if(e.cancelable)e.preventDefault();ptrSet(PTR.d)},{passive:false});
document.addEventListener('touchend',()=>{if(PTR.y0==null)return;PTR.y0=null;if(PTR.d>=PTR_MIN)ptrRun();else ptrSet(0,true);PTR.d=0});
document.addEventListener('touchcancel',()=>{if(PTR.y0==null)return;PTR.y0=null;PTR.d=0;ptrSet(0,true)});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='f_tmp__q'){e.preventDefault();ACT.addQ()}
 if(e.key==='Enter'&&e.target.id==='f_tmp__item'){e.preventDefault();ACT.addItem()}
 if(e.key==='Enter'&&e.target.id==='f_tmp__eq'){e.preventDefault();ACT.addEq()}
 if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('cp')){e.preventDefault();ACT.cyStep(e.target)}});
document.addEventListener('keydown',e=>{if(S.view!=='ciclo'||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;if(e.key==='ArrowRight')ACT.cyNext();if(e.key==='ArrowLeft')ACT.cyPrev()});

/* ---------- início ---------- */
async function boot(){
 render();prepBrand();initMCP();
 await idbOpen();
 const s=await idbGet('settings');if(s)S.settings=Object.assign({},DEF,s);delete S.settings.unidade;Object.assign(S.settings,{saMin:DEF.saMin,saMax:DEF.saMax,srMin:DEF.srMin,srMax:DEF.srMax});
 let ids=await idbGet('ids');
 if(!ids){const ex=exemplo();S.list=[ex];dirtyIds=true;markOS(ex)}
 else{const arr=await Promise.all(ids.map(id=>idbGet('os:'+id)));S.list=arr.filter(Boolean)}
 S.list.forEach(normOS);
 const cl=await idbGet('clientes');if(Array.isArray(cl))S.clientes=cl;
 S.list.forEach(o=>{if(linkOS(o)){markOS(o);markC()}});
 render();
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 await migrarFotos();await autoLimpeza();if(S.view==='home'||S.view==='empresa')render();
}
/* fotos antigas (guardadas como texto, 1400 px) viram binário de 1280 px + miniatura, uma única vez */
async function migrarFotos(){const old=[];S.list.forEach(o=>o.fotos.forEach(p=>{if(p.data&&!p.thumb)old.push([o,p])}));if(!old.length)return;
 let antes=0,depois=0,n=0;toast('Otimizando '+old.length+' foto'+(old.length>1?'s':'')+' antiga'+(old.length>1?'s':'')+'…');
 for(const [o,p] of old){try{const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=p.data});
   const r=await makePhoto(img,p.id||uid());antes+=p.data.length;depois+=r.size+r.thumb.length;Object.assign(p,r);delete p.data;markOS(o);n++}catch(e){}}
 await flush();if(n)toast(n+' foto'+(n>1?'s':'')+' otimizada'+(n>1?'s':'')+': '+fmtMB(Math.max(0,antes-depois))+' a menos.')}
window.__snow={satT,calc,diag,S};
boot();
})();
</script>
<style>
.nova-versao{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;width:min(440px,calc(100% - 32px));display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:18px;background:#14272F;border:1px solid var(--accent-line);box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:14px;font-weight:500}
.nova-versao span{flex:1}
.nova-versao .btn{min-height:42px;padding:0 16px;font-size:14px}
#instalar .btn{min-height:42px;padding:0 16px;font-size:14px;flex:none}
#instalar .ck-x{margin:0}
.passos{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--soft)}
</style>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var guardado=function(k){try{return localStorage.getItem(k)}catch(e){return null}};
var guardar=function(k,v){try{localStorage.setItem(k,v)}catch(e){}};
var instalado=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
var pedido=null;

/* cartão "Instale o app" no topo da tela inicial */
function pintar(){
  var c=$('#instalar');
  if(instalado||guardado('sf-instalar-dispensado')||(!pedido&&!ios)){if(c)c.remove();return}
  var main=$('.home .hm-main');if(!main||c)return;
  var s=document.createElement('section');s.id='instalar';s.className='space';
  s.innerHTML='<div><b>Instale o SnowField Tech</b><span>Abre como app, funciona sem internet e guarda seus dados com segurança.</span></div>'+
    '<button class="btn primary" id="btnInstalar">Instalar</button>'+
    '<button class="ck-x" id="btnInstalarX" aria-label="Agora não"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  main.insertBefore(s,main.firstChild);
}
document.addEventListener('click',function(e){
  if(e.target.closest('#btnInstalarX')){guardar('sf-instalar-dispensado','1');pintar();return}
  if(!e.target.closest('#btnInstalar'))return;
  if(pedido){pedido.prompt();pedido.userChoice.then(function(r){if(r&&r.outcome==='accepted'){pedido=null;pintar()}});return}
  var m=$('#modal');
  m.innerHTML='<div class="glass" role="dialog" aria-modal="true" aria-labelledby="it"><h2 id="it" class="h2">Instalar no iPhone</h2>'+
    '<ol class="passos"><li>Abra este endereço no <b>Safari</b>.</li><li>Toque em <b>Compartilhar</b>, o quadrado com a seta para cima.</li><li>Role e toque em <b>Adicionar à Tela de Início</b>.</li><li>Toque em <b>Adicionar</b>. O ícone do floco aparece na tela inicial.</li></ol>'+
    '<p class="note">Instalado, o iPhone não apaga os dados do app por falta de uso.</p><div class="acts"><button class="btn primary" data-m="no">Entendi</button></div></div>';
  m.hidden=false;m.onclick=function(ev){if(ev.target===m||ev.target.closest('[data-m]'))m.hidden=true};
});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();pedido=e;pintar()});
window.addEventListener('appinstalled',function(){instalado=true;pedido=null;pintar()});
new MutationObserver(pintar).observe($('#app'),{childList:true});

/* nova versão: avisa e atualiza quando o técnico tocar */
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  var recarregando=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(recarregando)return;recarregando=true;location.reload()});
  function aviso(reg){
    if($('#novaVersao'))return;
    var d=document.createElement('div');d.id='novaVersao';d.className='nova-versao';d.setAttribute('role','status');
    d.innerHTML='<span>Nova versão do app disponível.</span><button class="btn primary">Atualizar</button>';
    d.querySelector('button').onclick=function(){this.disabled=true;this.textContent='Atualizando…';setTimeout(function(){if(reg.waiting)reg.waiting.postMessage('atualizar')},700)};
    document.body.appendChild(d);
  }
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      if(reg.waiting&&navigator.serviceWorker.controller)aviso(reg);
      reg.addEventListener('updatefound',function(){var w=reg.installing;if(!w)return;w.addEventListener('statechange',function(){if(w.state==='installed'&&navigator.serviceWorker.controller)aviso(reg)})});
      setInterval(function(){reg.update()},60*60*1000);
      document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')reg.update()});
    }).catch(function(){});
  });
}
})();
</script>
